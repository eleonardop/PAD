name: Compilar e testar

on:
  push:
  pull_request:
  workflow_dispatch:

# bash com pipefail: um teste que falha derruba o passo mesmo com "| tee".
defaults:
  run:
    shell: bash

jobs:
  motor:
    name: Motor C++ (x86-64) — testes, sanitizers, WAVs e comparações
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # precisa da branch versao-0.2-som (v0.2) para a comparação v0.2 × v0.3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Testes automatizados (inclui 10 minutos simulados)
        run: ./build/engine/pad_tests | tee resultado_testes_x86_64.txt

      - name: Testes com AddressSanitizer + UBSan (memória e comportamento indefinido)
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake --build build-asan -j --target pad_tests
          ./build-asan/engine/pad_tests --rapido | tee resultado_testes_sanitizers.txt

      - name: Desempenho (servidor x86-64, só referência — não vale como medida do celular)
        run: ./build/engine/pad_bench | tee desempenho_x86_64.txt

      - name: Gerar WAVs de demonstração
        run: ./build/engine/pad_wavgen wav_exemplos

      - name: Respostas ao impulso e medidas dos reverbs
        run: |
          pip install --quiet numpy scipy soundfile matplotlib
          mkdir -p reverbs
          ./build/engine/pad_reverblab reverbs | tee reverbs/cpu.txt
          python3 tools/reverblab/analyze_ir.py reverbs reverbs/medidas.csv | tee reverbs/medidas.txt

      - name: Comparação v0.2 × v0.3 (testes A–M), estéreo e mono, loudness igualado
        run: |
          git worktree add ../v02 origin/versao-0.2-som
          (cd ../v02 && g++ -O2 -std=c++17 -DPAD_V2 -DBUFFER_SIZE=256 -Iengine/src \
            "$GITHUB_WORKSPACE/tools/compare/ScenariosV3.cpp" $(find engine/src -name '*.cpp') \
            engine/third_party/cloudseed/DSP/RandomBuffer.cpp engine/third_party/cloudseed/DSP/Biquad.cpp \
            -lpthread -o "$GITHUB_WORKSPACE/scen3_v02")
          ./scen3_v02 cmp_v02 ../v02/assets
          ./build/engine/pad_scenarios_v3 cmp_v03 assets
          python3 tools/compare/make_comparison_v3.py cmp_v02 cmp_v03 comparacao_v03

      - name: Refinamento v0.4 — acordes sustentados, antigos × novos, progressões, sementes
        run: |
          ./build/engine/pad_scenarios_refino refino_bruto assets
          python3 tools/compare/make_refino_package.py refino_bruto refino_v04

      - name: Pads de fundo v0.5 — tons das referências, v0.4 × v0.5, progressão
        run: |
          ./build/engine/pad_scenarios_pads pads_bruto assets
          python3 tools/compare/make_refino_package.py pads_bruto pads_v05

      - name: Publicar resultados (testes, desempenho, WAVs)
        uses: actions/upload-artifact@v4
        with:
          name: PAD-resultados-x86_64
          path: |
            resultado_testes_x86_64.txt
            resultado_testes_sanitizers.txt
            desempenho_x86_64.txt
            wav_exemplos/
            reverbs/

      - name: Publicar comparação v0.2 × v0.3 (A–M)
        uses: actions/upload-artifact@v4
        with:
          name: PAD-v03-comparacao-A-M
          path: |
            comparacao_v03/estereo/
            comparacao_v03/mono/
            comparacao_v03/espectrogramas/
            comparacao_v03/medicoes.csv
            comparacao_v03/medicoes.md

      - name: Publicar pacote de escuta v0.4
        uses: actions/upload-artifact@v4
        with:
          name: PAD-v04-refino-escuta
          path: |
            refino_v04/estereo/
            refino_v04/mono/
            refino_v04/originais/
            refino_v04/loudness.csv
            refino_v04/loudness.md

      - name: Publicar pacote de escuta v0.5 (pads de fundo)
        uses: actions/upload-artifact@v4
        with:
          name: PAD-v05-pads-escuta
          path: |
            pads_v05/estereo/
            pads_v05/mono/
            pads_v05/originais/
            pads_v05/loudness.csv
            pads_v05/loudness.md

  motor-arm64:
    name: Motor C++ (ARM64) — testes e desempenho
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Compilar (Release, ARM64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Testes automatizados em ARM64
        run: ./build/engine/pad_tests | tee resultado_testes_arm64.txt

      # Servidor ARM (Neoverse), não um celular: confirma que o código roda e dá uma
      # ordem de grandeza. A medida que vale é a do botão "Teste de desempenho" no aparelho.
      - name: Desempenho em ARM64 (referência)
        run: |
          lscpu | tee desempenho_arm64.txt
          ./build/engine/pad_bench | tee -a desempenho_arm64.txt

      - name: Publicar resultados ARM64
        uses: actions/upload-artifact@v4
        with:
          name: PAD-resultados-arm64
          path: |
            resultado_testes_arm64.txt
            desempenho_arm64.txt

  android:
    name: App Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # O Android SDK (com NDK e CMake) já vem instalado no runner ubuntu-latest (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PAD-Worship-APK
          path: android/app/build/outputs/apk/debug/*.apk

  android-dispositivo:
    name: App Android no emulador — ciclo de vida, encerramento e telas
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: PAD-Worship-APK
          path: apk

      - name: Habilitar KVM (emulador acelerado)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pillow (reduzir as capturas de tela)
        run: python3 -m pip install --user pillow

      - name: Verificação real no emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash tools/device/check_lifecycle.sh "$(ls apk/*.apk | head -1)"

      - name: Publicar resultados do dispositivo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PAD-dispositivo-ciclo-de-vida-e-telas
          path: device_results/
